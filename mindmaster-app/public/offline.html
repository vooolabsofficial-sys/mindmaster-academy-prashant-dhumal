<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindMaster Academy - Offline</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #F5F7FF;
      color: #0E1B3D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      border: 1px solid #E4E8F8;
      border-radius: 24px;
      padding: 32px;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(16, 20, 38, 0.08);
    }
    h1 { font-size: 20px; margin-bottom: 8px; color: #0E1B3D; }
    p { font-size: 14px; color: #5A6478; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      background-color: #0B57D0;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px; margin-bottom: 16px;">📶</div>
    <h1>You are currently offline</h1>
    <p>Please check your internet connection. Downloaded study notes remain accessible. Refresh once reconnected.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
